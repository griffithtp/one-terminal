<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ot-fdc3-app-id" content="sample-widget" />
    <title>Sample Widget</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #388bfd;
        --green: #3fb950;
        --red: #f85149;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, "Cascadia Code", monospace;
        font-size: 13px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .title {
        font-weight: 700;
        font-size: 15px;
      }
      .badge {
        font-size: 10px;
        background: rgba(56, 139, 253, 0.15);
        color: var(--accent);
        border: 1px solid rgba(56, 139, 253, 0.3);
        border-radius: 10px;
        padding: 2px 8px;
      }
      #status {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      #status.ok {
        color: var(--green);
      }
      #status.err {
        color: var(--red);
      }
      #channel {
        font-size: 11px;
        color: var(--muted);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input,
      button {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: inherit;
        font-size: 12px;
      }
      input {
        flex: 1;
      }
      button {
        cursor: pointer;
        border-color: var(--accent);
        color: var(--accent);
      }
      button:hover {
        background: rgba(56, 139, 253, 0.1);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .panel-title {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      pre {
        font-size: 11px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log {
        max-height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .log-entry {
        font-size: 11px;
        color: var(--muted);
      }
      .log-entry .ts {
        color: rgba(139, 148, 158, 0.6);
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">Sample Widget</span>
      <span class="badge">FDC3 3.0</span>
      <span id="status">Connecting…</span>
      <span id="channel">○ No channel</span>
    </header>

    <div class="row">
      <input id="ticker" value="AAPL" placeholder="Ticker (e.g. AAPL)" />
      <button id="broadcast">Broadcast instrument</button>
    </div>

    <div class="panel">
      <div class="panel-title">Last received context</div>
      <pre id="last">(none)</pre>
    </div>

    <div class="panel">
      <div class="panel-title">Activity</div>
      <div id="log"></div>
    </div>

    <script type="module">
      // The plugin connects once per page. Using its shared connection lets the
      // Terminal's "Set channel" menu control this widget's channel.
      import { getAgent } from "./fdc3-plugin.js";
      // In a OneTerminal window, report this page's errors to OneTerminal's
      // logs (`undefined` elsewhere, hence `telemetry?.`).
      import { startWidgetTelemetry } from "./ot-telemetry.js";

      const telemetry = startWidgetTelemetry({ captureConsole: true });
      const statusEl = document.getElementById("status");
      const channelEl = document.getElementById("channel");
      const lastEl = document.getElementById("last");
      const logEl = document.getElementById("log");
      const tickerEl = document.getElementById("ticker");
      const broadcastBtn = document.getElementById("broadcast");

      // Builds DOM nodes, never markup: logged values include FDC3 context
      // and channel ids from other apps, which are untrusted.
      // `log("Broadcast ", strong(ticker))` — strings become text nodes.
      function strong(text) {
        const el = document.createElement("strong");
        el.textContent = String(text);
        return el;
      }

      function log(...parts) {
        const entry = document.createElement("div");
        entry.className = "log-entry";
        const ts = document.createElement("span");
        ts.className = "ts";
        ts.textContent = new Date().toTimeString().slice(0, 8);
        entry.append(ts, ...parts);
        logEl.prepend(entry);
        while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
      }

      let fdc3 = null;
      let channels = [];

      function showChannel(channelId) {
        const ch = channels.find((c) => c.id === channelId);
        channelEl.textContent = channelId
          ? `● ${ch?.displayMetadata?.name ?? channelId}`
          : "○ No channel";
        channelEl.style.color = (channelId && ch?.displayMetadata?.color) || "";
      }

      try {
        fdc3 = await getAgent();
        const { appMetadata } = await fdc3.getInfo();
        statusEl.textContent = `Connected · ${appMetadata.instanceId.slice(0, 8)}`;
        statusEl.className = "ok";
        log("Connected to FDC3 agent");

        channels = await fdc3.getUserChannels();
        await fdc3.addEventListener("userChannelChanged", (e) => {
          const id = e.details.currentChannelId;
          showChannel(id);
          log(...(id ? ["Joined channel ", strong(id)] : ["Left channel"]));
        });

        // Inside a Terminal (OT_FDC3_INITIAL_CHANNEL defined, even as null)
        // the Terminal owns channel membership. Standalone, join a default.
        if (window.OT_FDC3_INITIAL_CHANNEL === undefined && channels.length > 0) {
          await fdc3.joinUserChannel(channels[0].id);
        }
        showChannel((await fdc3.getCurrentChannel())?.id ?? null);

        await fdc3.addContextListener("fdc3.instrument", (ctx, meta) => {
          lastEl.textContent = JSON.stringify(ctx, null, 2);
          // `traceId` relates this record to the broadcast that delivered it.
          telemetry?.log("info", "instrument received", { traceId: meta?.traceId });
          log("Received instrument: ", strong(ctx.id?.ticker ?? ctx.name ?? "?"));
        });
      } catch (e) {
        statusEl.textContent =
          window.OT_FDC3_AGENT_URL === "" ? "No FDC3 agent configured" : "Agent unavailable";
        statusEl.className = "err";
        log(`Connection failed: ${e.cause?.message ?? e.message}`);
        telemetry?.error(e, { attributes: { "fdc3.op": "connect" } });
      }

      broadcastBtn.addEventListener("click", async () => {
        if (!fdc3) {
          log("Cannot broadcast — no agent connection");
          return;
        }
        const ticker = tickerEl.value.trim().toUpperCase();
        if (!ticker) return;
        const context = {
          type: "fdc3.instrument",
          name: ticker,
          id: { ticker },
        };
        try {
          await fdc3.broadcast(context);
          log("Broadcast ", strong(ticker));
        } catch (e) {
          log(`Broadcast failed: ${e.message}`);
          telemetry?.error(e, { attributes: { "fdc3.op": "broadcast" } });
        }
      });
    </script>
  </body>
</html>

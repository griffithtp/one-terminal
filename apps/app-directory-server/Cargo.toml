[package]
name = "app-directory-server"
version = "0.1.0"
description = "Standalone App Directory server — hosted/Docker deployment. Thin binary wrapping ot-appdirectory; no Tauri deps."
edition = "2021"

[[bin]]
name = "app-directory-server"
path = "src/main.rs"

[dependencies]
tokio           = { workspace = true }
axum            = { workspace = true }
tower-http      = { workspace = true }
ot-appdirectory = { workspace = true }

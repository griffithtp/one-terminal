[package]
name = "one-terminal"
version = "0.1.0"
description = "OneTerminal — dynamic tiling container with multi-browser-engine support"
authors = ["one-terminal"]
edition = "2021"

[lib]
name = "one_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { workspace = true, features = ["unstable", "macos-private-api"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
reqwest      = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
zip          = { workspace = true }
futures-util = { workspace = true }
url          = "2"
uuid         = { version = "1", features = ["v4"] }
ot-core      = { workspace = true }

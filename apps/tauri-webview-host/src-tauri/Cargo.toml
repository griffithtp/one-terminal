[package]
name = "tauri-webview-host"
version = "0.1.0"
description = "Minimal Tauri host that opens one external-URL webview — spawned by the CDA engine router when a pinned WebView2 runtime is needed"
authors = ["one-terminal"]
edition = "2021"

[[bin]]
name = "tauri-webview-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

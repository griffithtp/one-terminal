[package]
name = "tauri-webview-host"
version = "0.1.0"
description = "Minimal Tauri host that opens one external-URL webview — spawned by the CDA engine router when a pinned WebView2 runtime is needed"
authors = ["one-terminal"]
edition = "2021"
publish = false

[[bin]]
name = "tauri-webview-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# Local log files only (no `otlp` feature): this thin per-window host carries no
# exporter, TLS stack or export threads. Its log lines still carry the
# TRACEPARENT trace id of the span that launched it.
ot-telemetry = { workspace = true }
tracing      = { workspace = true }
ot-core      = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "apps/one-terminal/src-tauri",
    "apps/desktop-agent/src-tauri",
    "apps/tauri-webview-host/src-tauri",
    "packages/ot-core",
    "packages/ot-fdc3",
]

# ── Shared dependency versions ────────────────────────────────────────────────
# Add new apps/packages here and reference these via `{ workspace = true }`.
[workspace.dependencies]
# Serialisation
serde     = { version = "1",      features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1.50.0", features = ["full"] }

# Utilities
rand = "0.8"

# HTTP / WebSocket
axum        = { version = "0.7", features = ["ws"] }
tower-http  = { version = "0.5", features = ["cors"] }

# Tauri
tauri              = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"

# Concurrency
dashmap  = { version = "6", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }

# WebSocket client
tokio-tungstenite = "0.24"
futures-util      = "0.3"

# HTTP client (used by CDA app-directory fetch)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Engine runtime cache (download/verify/extract)
sha2 = "0.10"
hex  = "0.4"
zip  = { version = "0.6", default-features = false, features = ["deflate"] }

# Internal crates
ot-core = { path = "packages/ot-core" }
ot-fdc3  = { path = "packages/ot-fdc3" }

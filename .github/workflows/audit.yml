name: Dependency audit

# Runs on every change and weekly, so a newly published advisory surfaces even when
# nobody touches dependencies. To accept an advisory that doesn't apply, add it to
# `ignore` in deny.toml with a reason — never disable the job.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

jobs:
  cargo-deny:
    name: Rust advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  npm-audit:
    name: npm advisories (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Reads package-lock.json only; nothing is installed.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

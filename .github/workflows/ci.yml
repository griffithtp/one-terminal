name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Create stub frontend dist dirs
        run: mkdir -p apps/one-terminal/dist apps/desktop-agent/dist apps/tauri-webview-host/dist
        # apps/app-directory/ui/dist is NOT stubbed here — packages/ot-appdirectory's
        # build.rs creates its own placeholder if missing (rust-embed needs the
        # folder to exist at compile time; see build.rs for why).

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build check
        run: cargo check --workspace

      - name: Tests
        run: cargo test --workspace

  typescript:
    name: TypeScript lint, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build app-directory
        run: npm run build:app-directory

      - name: Build scaffolder
        run: npm run build:scaffolder

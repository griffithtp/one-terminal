# Environment for GitHub Copilot's coding agent. The job must be named
# `copilot-setup-steps`; Copilot runs it before starting work on an issue or PR.
# The shared setup lives in scripts/agent-setup.sh so other cloud agents use the same steps.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/agent-setup.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/agent-setup.sh

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Shared agent setup
        run: bash scripts/agent-setup.sh

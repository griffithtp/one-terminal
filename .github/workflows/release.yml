name: Release

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            # Apple Silicon only for now, not `universal-apple-darwin` — a
            # universal build needs the one-terminal sidecar cross-compiled
            # for both aarch64 and x86_64 before desktop-agent embeds it,
            # which is unverified. See docs/plans/07-deployment-and-hosting.md
            # Issue 07-A.
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }

      - run: npm ci

      - name: Build App Directory admin UI
        # packages/ot-appdirectory embeds apps/app-directory/ui/dist/ via
        # rust-embed at compile time — must exist before any cargo build
        # below, or desktop-agent/app-directory-server ship the build.rs
        # placeholder instead of the real admin UI.
        run: npm run build:app-directory

      - name: Release one-terminal (standalone installer)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/one-terminal
          tagName: ${{ github.ref_name }}
          releaseName: "OneTerminal ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Release desktop-agent (single-download bundle — embeds one-terminal + App Directory)
        # desktop-agent's own `build` script (apps/desktop-agent/package.json)
        # runs scripts/build-terminal-sidecar.ts as part of beforeBuildCommand,
        # which builds one-terminal for `${{ matrix.target }}` (via
        # TAURI_ENV_TARGET_TRIPLE, set by tauri-action's --target arg below)
        # and embeds it as the externalBin sidecar. No separate step needed.
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop-agent
          tagName: ${{ github.ref_name }}
          releaseName: "OneTerminal ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
